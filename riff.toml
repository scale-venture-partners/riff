# riff configuration. Codes and prefixes follow ruff semantics: select/ignore accept
# either full codes (JEV001) or prefixes (JEV, RIF1). Command-line flags override this file.

# Leave `select` unset to run every default-on rule. Uncomment to restrict.
# select = ["RIF", "WRD", "CLR", "JEV"]

ignore = []            # e.g. ["WRD001"] to stop flagging overused vocabulary
extend-select = []     # e.g. ["WRD104"] to turn on passive-voice detection
jev = true             # set false (or pass --no-jev) to skip the semantic rules
model = "jev-latest"

max-sentence-words = 45
max-reading-grade = 14

[thresholds]
# Per-rule Jev sensitivity (0..1). Higher = fewer, more confident flags.
# JEV001 = 0.7

# Custom rules: add your own team- or domain-specific checks here (no code changes).
# type = "jev" asks a yes/no question about your text; type = "phrase" flags literal
# strings offline. Custom codes must not collide with a built-in code.
#
# [[custom_rules]]
# code = "TEAM001"
# name = "house-style-bans"
# type = "phrase"
# summary = "House-style banned phrase"
# phrases = ["circle back", "synergy", "boil the ocean"]
#
# [[custom_rules]]
# code = "TEAM002"
# name = "no-competitor-names"
# type = "jev"
# summary = "Names a competitor"
# question = "Does this passage name a specific competing product or company?"
# threshold = 0.6
# scope = "block"

# Document-type classification runs by default (one Jev call). Turn it off, or force a type,
# from the CLI (--no-classify / --type email). A custom rule can gate on type with
# applies_to / skip_for, e.g. skip_for = ["email", "letter"].
# classify = true
