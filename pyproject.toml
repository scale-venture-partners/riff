[project]
name = "riff-lint"
version = "0.1.0"
description = "A small, fast prose linter: ruff-style rule codes for writing, backed by TypeSafe's Jev model"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Scale Venture Partners" }]
keywords = ["linter", "prose", "writing", "style", "editing", "ai-writing", "typesafe", "jev"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Text Processing :: Linguistic",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
  "typesafe-sdk>=0.6.0",
  "python-docx>=1.1",
  "python-pptx>=1.0",
  "beautifulsoup4>=4.12",
]

[project.urls]
Repository = "https://github.com/scale-venture-partners/riff"
Issues = "https://github.com/scale-venture-partners/riff/issues"

[project.scripts]
riff = "riff.cli:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/riff"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Rule catalogs are tables of long human-readable instruction strings; wrapping them hurts readability.
"src/riff/rules/static_rules.py" = ["E501"]
"src/riff/rules/jev_rules.py" = ["E501"]
"src/riff/jev.py" = ["E501"]
"src/riff/settings.py" = ["E501"]
"src/riff/cli.py" = ["E501"]
"tests/*" = ["E501"]

[tool.ruff.format]
quote-style = "double"
